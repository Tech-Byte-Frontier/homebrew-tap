name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, test and audit
        run: |
          [ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap tech-byte-frontier/tap "$GITHUB_WORKSPACE"
          brew install tech-byte-frontier/tap/jevgate
          brew test tech-byte-frontier/tap/jevgate
          brew audit --strict tech-byte-frontier/tap/jevgate
